server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: schemesathi-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/schemesathi}
    username: ${DATABASE_USERNAME:schemesathi}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
spring.web.resources:
  static-locations: classpath:/static/
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-change-this-32chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:8080}
