services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schemesathi
      POSTGRES_USER: schemesathi
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-schemesathi_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemesathi -d schemesathi"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/schemesathi
      DATABASE_USERNAME: schemesathi
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-schemesathi_local}
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-characters-long-secret}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      PORT: 8080
    ports:
      - "8080:8080"
volumes:
  postgres_data:
